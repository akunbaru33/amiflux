{% extends "base.html" %}
{% block title %}Login — NF Checker{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 col-sm-10">
        <div class="text-center mb-4">
            <h1 style="color:#e50914;font-weight:900;font-size:2.5rem;">🎬 NF CHECKER</h1>
            <p style="color:#b3b3b3;">Sign in to access your account</p>
        </div>

        <div class="card shadow-lg">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label" style="color:#b3b3b3;">
                            <i class="bi bi-person"></i> Username
                        </label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" style="color:#b3b3b3;">
                            <i class="bi bi-lock"></i> Password
                        </label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-netflix">
                            <i class="bi bi-box-arrow-in-right"></i> Sign In
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <p class="text-center mt-3" style="color:#555;font-size:0.8rem;">
            Contact admin to get an account.
        </p>
    </div>
</div>
{% endblock %}
