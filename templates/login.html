{% extends "base.html" %}
{% block title %}Our Cinema 💕{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 col-sm-10">

        <!-- Logo & Title -->
        <div class="text-center mb-5">
            <div style="font-size:3.2rem; margin-bottom:12px;">🎬</div>
            <h1 style="color:#ff2b56; font-size:2.4rem; font-weight:900; margin-bottom:8px; text-shadow:0 0 20px rgba(255,43,86,0.5);">
                Our Cinema
            </h1>
            <p style="color:#ffccd5; font-size:1rem; font-style:italic;">
                "Every night is movie night when it's with you" 🌹
            </p>
        </div>

        <!-- Login Card -->
        <div class="card shadow-lg" style="border-color:#4a101d;">
            <div class="card-body p-4">

                <p class="text-center mb-4" style="color:#ff4d6d; font-size:1.2rem; font-weight:700; letter-spacing:-0.02em;">
                    Welcome back, love 💕
                </p>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label" style="color:#ff85a1; font-size:0.92rem; font-weight:600;">
                            👤 Username
                        </label>
                        <input type="text" name="username" class="form-control"
                               placeholder="Enter your name..." required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" style="color:#ff85a1; font-size:0.92rem; font-weight:600;">
                            🔒 Password
                        </label>
                        <div class="input-group">
                            <input type="password" id="loginPassword" name="password" class="form-control"
                                   placeholder="Our little secret..." required style="border-right:none; border-top-right-radius:0; border-bottom-right-radius:0;">
                            <button class="btn" type="button" onclick="toggleLoginPassword()"
                                    id="toggleBtn"
                                    title="Show/Hide Password"
                                    style="background-color:#0e0306; border:1.5px solid var(--border); border-left:none; border-top-right-radius:10px; border-bottom-right-radius:10px; color:#ff85a1; padding:0 16px;">
                                <i class="bi bi-eye" id="eyeIcon" style="font-size:1.15rem;"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-rose btn-lg" style="font-weight:700; letter-spacing:0.5px;">
                            Login
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function toggleLoginPassword() {
        const input = document.getElementById('loginPassword');
        const icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
            icon.style.color = '#ffffff';
        } else {
            input.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
            icon.style.color = '#ff85a1';
        }
    }
</script>
{% endblock %}
